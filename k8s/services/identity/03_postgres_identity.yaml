---
# 1. PersistentVolumeClaim: Lưu trữ data postgres kể cả khi pod restart
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-identity-pvc
  namespace: microservices-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# 2. Service: Expose port nội bộ cho identity-service kết nối
apiVersion: v1
kind: Service
metadata:
  name: postgres-identity-service
  namespace: microservices-platform
spec:
  selector:
    app: postgres-identity
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

---
# 3. Deployment: PostgreSQL cho Identity Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-identity
  namespace: microservices-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-identity
  template:
    metadata:
      labels:
        app: postgres-identity
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: identity-config
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-secret
                  key: DATABASE_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: identity-config
                  key: DATABASE_DBNAME
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - user_admin
                - -d
                - identity_db
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: postgres-identity-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-identity-storage
          persistentVolumeClaim:
            claimName: postgres-identity-pvc
