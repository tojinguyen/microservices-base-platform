---
# 1. Service: Expose identity-service ra ngoài qua LoadBalancer
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: microservices-platform
spec:
  type: ClusterIP
  selector:
    app: identity
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8080
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: 50051

---
# 2. Deployment: Identity Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-deployment
  namespace: microservices-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: identity
          image: identity-service:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          # Inject tất cả config và secret vào container
          envFrom:
            - configMapRef:
                name: identity-config
            - secretRef:
                name: identity-secret
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3