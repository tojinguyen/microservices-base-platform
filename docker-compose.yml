version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: identity-postgres
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: identity_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Identity Service
  identity-service:
    build:
      context: .                         
      dockerfile: services/identity/Dockerfile
    container_name: identity-service
    ports:
      - "8081:8080" 
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      - PORT=8080
      - TIME_GRACE=10

      # Database Config
      - DATABASE_HOST=postgres-db
      - DATABASE_PORT=5432
      - DATABASE_USER=user_admin
      - DATABASE_PASSWORD=password123
      - DATABASE_DBNAME=identity_db
      - DATABASE_SSLMODE=disable

      # JWT Config 
      - JWT_SECRET_KEY=PhaiThayDoiKeyNayKhiLenProduction123!
      - JWT_ISSUER=identity-service
      - JWT_ACCESS_TOKEN_LIFESPAN=24 
      - JWT_REFRESH_TOKEN_LIFESPAN=168 

      # Google OAuth 
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_CLIENT_ID:-your_google_id}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-your_google_secret}
      - GOOGLE_OAUTH_REDIRECT_URL=http://localhost:8081/api/v1/auth/google/callback

volumes:
  postgres_data: