---
# 1. ConfigMap: Cấu hình chung cho tất cả Notification components
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: microservices-platform
data:
  PORT: "8082"
  TIME_GRACE: "10"
  DATABASE_HOST: "postgres-notification-service"
  DATABASE_PORT: "5432"
  DATABASE_USER: "user_admin"
  DATABASE_DBNAME: "notification_db"
  DATABASE_SSLMODE: "disable"
  BROKER_HOST: "rabbitmq-service"
  BROKER_PORT: "5672"
  BROKER_USER: "guest"
  QUEUE_EXCHANGE: "notification.direct"
  QUEUE_WEBHOOK_MAILPIT: "webhook_mailpit"
  SMTP_HOST: "mailpit-service"
  SMTP_PORT: "1025"
  SMTP_FROM: "no-reply@microservices.local"
  SMTP_USERNAME: ""
  WORKER_BATCH_SIZE: "10"
  WORKER_INTERVAL: "5"
  REDIS_HOST: "redis-notification-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  RATE_LIMIT_GLOBAL_LIMIT: "100"
  RATE_LIMIT_GLOBAL_WINDOW_SECS: "60"
  RATE_LIMIT_SEND_LIMIT: "10"
  RATE_LIMIT_SEND_WINDOW_SECS: "60"
  IDENTITY_GRPC_ADDR: "identity-service:50051"
  WORKER_CIRCUIT_BREAKER_MAX_FAILURES: "5"
  WORKER_CIRCUIT_BREAKER_OPEN_DURATION: "30s"
  WORKER_OUTBOX_INTERVAL: "2"
  WORKER_OUTBOX_BATCH_SIZE: "100"
  WORKER_OUTBOX_MAX_RETRIES: "5"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-service:4318"

---
# 2. Service: Expose Notification API để các service khác gọi vào
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: microservices-platform
spec:
  type: ClusterIP
  selector:
    app: notification-api
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082

---
# 3. Deployment A: Notification API (HTTP Server)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-api
  namespace: microservices-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-api
  template:
    metadata:
      labels:
        app: notification-api
    spec:
      containers:
        - name: notification-api
          image: notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          envFrom:
            - configMapRef:
                name: notification-config
            - secretRef:
                name: notification-secret
          env:
            - name: APP_MODE
              value: "api"
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3


---
# 5. Deployment C: Worker gửi Email (consume từ RabbitMQ → SMTP)
