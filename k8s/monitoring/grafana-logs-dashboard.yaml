apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-logs-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  microservices-logs.json: |
    {
      "title": "Microservices Logs",
      "uid": "microservices-logs-v1",
      "description": "Structured application logs từ tất cả microservices — filter theo service, level, trace_id",
      "tags": ["microservices", "logs", "loki"],
      "timezone": "Asia/Ho_Chi_Minh",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m", "5m"],
        "time_options": ["5m", "15m", "1h", "6h", "12h", "24h", "2d", "7d"]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Loki Datasource",
            "type": "datasource",
            "query": "loki",
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "refresh": 1,
            "current": {}
          },
          {
            "name": "service",
            "label": "Service",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "definition": "label_values(service)",
            "query": "label_values(service)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "refresh": 2,
            "sort": 1,
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "level",
            "label": "Log Level",
            "type": "custom",
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "multi": false,
            "query": ".*,debug,info,warn,error",
            "options": [
              {"selected": true,  "text": "All",   "value": ".*"},
              {"selected": false, "text": "debug",  "value": "debug"},
              {"selected": false, "text": "info",   "value": "info"},
              {"selected": false, "text": "warn",   "value": "warn"},
              {"selected": false, "text": "error",  "value": "error"}
            ],
            "current": {
              "selected": true,
              "text": "All",
              "value": ".*"
            }
          },
          {
            "name": "search",
            "label": "Search (msg / trace_id)",
            "type": "textbox",
            "hide": 0,
            "current": {
              "selected": false,
              "text": "",
              "value": ""
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Log Stream",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0},
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "logs",
          "title": "Application Logs",
          "description": "Log stream từ tất cả services. Expand từng dòng để xem Fields chi tiết (trace_id, method, path, status, latency_ms...).",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {"h": 20, "w": 24, "x": 0, "y": 1},
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "queryType": "range",
              "expr": "{service=~\"$service\", level=~\"$level\"} | json |~ \"$search\""
            }
          ]
        },
        {
          "id": 3,
          "type": "row",
          "title": "Log Volume",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 21},
          "collapsed": false,
          "panels": []
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Log Rate by Level (logs/s)",
          "description": "Tốc độ ghi log theo từng severity level — spike ở 'error' cần điều tra ngay.",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 22},
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "lineInterpolation": "linear",
                "barAlignment": 0,
                "fillOpacity": 40,
                "gradientMode": "none",
                "spanNulls": false,
                "lineWidth": 1,
                "stacking": {"mode": "normal", "group": "A"}
              },
              "unit": "reqps",
              "color": {"mode": "palette-classic"}
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "error"},
                "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]
              },
              {
                "matcher": {"id": "byName", "options": "warn"},
                "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}}]
              },
              {
                "matcher": {"id": "byName", "options": "info"},
                "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}]
              }
            ]
          },
          "options": {
            "tooltip": {"mode": "multi", "sort": "none"},
            "legend": {"displayMode": "list", "placement": "bottom", "calcs": []}
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "loki", "uid": "${datasource}"},
              "editorMode": "code",
              "queryType": "range",
              "expr": "sum by (level) (rate({service=~\"$service\"} | json [1m]))",
              "legendFormat": "{{level}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Log Rate by Service (logs/s)",
          "description": "Tốc độ ghi log theo từng service — dễ phát hiện service nào đang flood log.",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 22},
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "lineInterpolation": "linear",
                "barAlignment": 0,
                "fillOpacity": 30,
                "gradientMode": "none",
                "spanNulls": false,
                "lineWidth": 1,
                "stacking": {"mode": "normal", "group": "A"}
              },
              "unit": "reqps",
              "color": {"mode": "palette-classic"}
            },
            "overrides": []
          },
          "options": {
            "tooltip": {"mode": "multi", "sort": "none"},
            "legend": {"displayMode": "list", "placement": "bottom", "calcs": []}
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "loki", "uid": "${datasource}"},
              "editorMode": "code",
              "queryType": "range",
              "expr": "sum by (service) (rate({service=~\"$service\", level=~\"$level\"} [1m]))",
              "legendFormat": "{{service}}"
            }
          ]
        }
      ],
      "links": []
    }
