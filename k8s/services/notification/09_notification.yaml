spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker-email
  template:
    metadata:
      labels:
        app: notification-worker-email
    spec:
      containers:
        - name: notification-worker-email
          image: notification-service:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          envFrom:
            - configMapRef:
                name: notification-config
            - secretRef:
                name: notification-secret
          env:
            - name: APP_MODE
              value: "worker-email"

